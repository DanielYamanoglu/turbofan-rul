[project]
name = "turbofan-rul"
version = "0.1.0"
description = "Remaining-useful-life prediction for turbofan engines: SQL features, gradient boosting, drift monitoring, API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mlflow-skinny>=2.16",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
turbofan-rul = "turbofan_rul.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turbofan_rul"]

[tool.pytest.ini_options]
testpaths = ["tests"]
